<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Sin Vergüenza - Tabla de posiciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --carbon:#11100E; --marfil:#FFF1CF; --rojo:#A91F27; --oro:#D9A832;
  --carbon2:#1A1814; --oro-dim:#8A6A1F; --marfil-dim:#B8AD93;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--carbon);color:var(--marfil);
  font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:18px;line-height:1.3;
  background-image:
    radial-gradient(ellipse at 50% -5%,rgba(217,168,50,.16),transparent 55%),
    repeating-linear-gradient(0deg,rgba(255,241,207,.022) 0 1px,transparent 1px 7px);
}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 70px}
header{text-align:center;margin-bottom:26px}
header img{width:min(280px,62vw);height:auto;display:block;margin:0 auto 4px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.65))}
h1{font-family:"Pirata One",Georgia,serif;font-weight:400;font-size:clamp(30px,6.4vw,52px);color:var(--oro);margin:0;line-height:1;text-shadow:0 3px 0 #3a2a08}
h1 span{display:block;font-family:"Barlow Condensed",sans-serif;font-size:clamp(14px,2.4vw,18px);letter-spacing:.3em;color:var(--marfil-dim);margin-top:8px}

.status{text-align:center;font-size:15px;color:var(--marfil-dim);margin:0 0 18px;min-height:1.2em}
.status.err{color:#E05A60}
.status b{color:var(--oro);font-weight:700}

.tier{margin:0 0 18px;border:1px solid rgba(217,168,50,.3);background:var(--carbon2)}
.tier.t1{border:2px solid var(--oro);box-shadow:0 0 0 4px var(--carbon),0 0 0 5px var(--oro-dim),0 20px 50px rgba(0,0,0,.6)}
.tier.t2{border-color:var(--oro)}
.tier.t3{border-color:var(--oro-dim)}

.tier-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:linear-gradient(90deg,rgba(169,31,39,.5),rgba(169,31,39,0))}
.tier.t1 .tier-head{background:linear-gradient(90deg,var(--rojo),rgba(169,31,39,.12))}
.tier-head h2{font-family:"Pirata One",Georgia,serif;font-weight:400;font-size:24px;margin:0;color:var(--oro);line-height:1.15;flex:1 1 auto;min-width:0}
.tier.t1 .tier-head h2{font-size:32px;color:var(--marfil)}
.tier.t2 .tier-head h2{font-size:27px}
.bars{display:flex;gap:3px;flex:0 0 auto}
.bars i{display:block;width:5px;height:17px;background:var(--oro);transform:skewX(-14deg)}
.tier.t4 .bars i,.tier.t5 .bars i{background:var(--oro-dim)}
.count{font-size:14px;color:var(--marfil-dim);flex:0 0 auto;font-variant-numeric:tabular-nums}

.member{display:grid;grid-template-columns:1fr 88px 44px;align-items:center;gap:8px;padding:5px 8px 5px 14px;border-top:1px solid rgba(255,241,207,.08)}
.member input{background:transparent;border:0;border-bottom:1px dashed rgba(255,241,207,.22);color:var(--marfil);font:inherit;font-size:19px;padding:7px 3px;width:100%;outline:none;min-width:0}
.tier.t1 .member input.name{font-size:24px}
.member input:focus{border-bottom:2px solid var(--oro);background:rgba(217,168,50,.08)}
.member input::placeholder{color:rgba(255,241,207,.28)}
.member input.pts{text-align:right;font-weight:700;font-size:22px;color:var(--oro);font-variant-numeric:tabular-nums}
.member input.pts.neg{color:#E05A60}
.del{display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:transparent;border:0;color:rgba(255,241,207,.3);font-size:24px;line-height:1;cursor:pointer}
.del:hover,.del:focus-visible{color:#E05A60;outline:none}
.add{width:100%;text-align:left;background:transparent;border:0;border-top:1px solid rgba(255,241,207,.08);color:var(--marfil-dim);font:inherit;font-size:16px;padding:11px 14px;cursor:pointer}
.add:hover,.add:focus-visible{color:var(--oro);background:rgba(217,168,50,.07);outline:none}

.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.bar button{font:inherit;font-weight:700;font-size:16px;letter-spacing:.05em;cursor:pointer;padding:11px 18px;border:2px solid var(--oro);background:var(--carbon);color:var(--oro)}
.bar button:hover,.bar button:focus-visible{background:var(--oro);color:var(--carbon);outline:none}
.bar button:disabled{opacity:.4;cursor:default}

@media (max-width:520px){
  .tier-head h2{flex:1 1 100%;order:1}
  .bars{order:2}
  .bars i{height:14px;width:4px}
  .count{order:3;margin-left:auto}
  .tier.t1 .tier-head h2{font-size:26px}
  .tier.t2 .tier-head h2{font-size:22px}
  .tier-head h2{font-size:21px}
  .member{grid-template-columns:1fr 74px 44px;padding-left:12px}
  .tier.t1 .member input.name{font-size:20px}
  .member input{font-size:17px}
  .member input.pts{font-size:19px}
}
</style>
</head>

    <h1>Tabla de posiciones<span>LA TRIPULACIÓN</span></h1>
  </header>

  <p class="status" id="status">Conectando con la nave...</p>
  <div id="board"></div>

  <div class="bar">
    <button id="sortBtn" type="button" disabled>Ordenar por puntaje</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/compat/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/compat/firebase-database-compat.js"></script>
<script>
const DATABASE_URL="https://sin-verguenza-default-rtdb.firebaseio.com";

const RANKS=["Capitán","Maestre","Contramaestre","Timonel","Oficial de cubierta",
             "Maestro de máquinas","Vigía","Cocinero","Almirante / Cocinero","Grumete"];
const SEED=[
 [0,"",58],[1,"",46],[2,"",27],[3,"",21],[4,"",12],[5,"",6],
 [6,"Popó",4],[6,"Ian",3],[6,"Guadalupe",3],[6,"Fernanda",3],[6,"Cuau",2],[6,"Charles",0],[6,"Omar",-2],
 [7,"Rodri",1],[7,"Gabriel",1],[7,"Jr",1],[7,"Gaby",0],
 [8,"Diego",0],[9,"Emi",0]
];

firebase.initializeApp({databaseURL:DATABASE_URL});
const ref=firebase.database().ref("tripulacion");
const board=document.getElementById("board"),status=document.getElementById("status");
const sortBtn=document.getElementById("sortBtn");
let state={},signature="",timers={};

function say(txt,err){status.innerHTML=txt;status.className="status"+(err?" err":"");}

ref.once("value").then(snap=>{
  if(snap.exists())return;
  const seed={};
  SEED.forEach(([t,n,p],i)=>{seed[ref.push().key]={t,n,p,o:i};});
  return ref.set(seed);
}).catch(e=>say("No se pudo sembrar la tabla: "+e.message,true));

ref.on("value",snap=>{
  state=snap.val()||{};
  sortBtn.disabled=false;
  render();
  say("Conectado. Los cambios se ven en <b>todos los celulares</b>.");
},e=>say("Sin conexión con la base de datos: "+e.message,true));

function write(id,field,value){
  clearTimeout(timers[id+field]);
  timers[id+field]=setTimeout(()=>{
    ref.child(id).child(field).set(value).catch(e=>say("No se guardó: "+e.message,true));
  },400);
}

function groups(){
  const g=RANKS.map(()=>[]);
  Object.entries(state).forEach(([id,m])=>{
    const t=Number(m.t); if(g[t])g[t].push({id,...m});
  });
  g.forEach(a=>a.sort((x,y)=>(x.o??0)-(y.o??0)));
  return g;
}

function render(){
  const g=groups();
  const sig=g.map(a=>a.map(m=>m.id).join(",")).join("|");
  if(sig===signature){refreshValues(g);return;}
  signature=sig;
  const focusId=document.activeElement?.dataset?.key;
  board.innerHTML="";
  g.forEach((members,ti)=>{
    const lvl=Math.min(ti+1,5);
    const sec=document.createElement("section");
    sec.className="tier t"+lvl;
    const bars=Array.from({length:Math.max(1,10-ti)},()=>"<i></i>").join("");
    sec.innerHTML=`<div class="tier-head"><h2>${RANKS[ti]}</h2><div class="bars">${bars}</div>
      <span class="count">${members.length} ${members.length===1?"tripulante":"tripulantes"}</span></div>`;
    members.forEach(m=>sec.appendChild(row(m,ti)));
    const add=document.createElement("button");
    add.className="add";add.type="button";add.textContent="+ Agregar tripulante a "+RANKS[ti];
    add.onclick=()=>{
      const o=members.length?Math.max(...members.map(x=>x.o??0))+1:0;
      ref.push({t:ti,n:"",p:0,o}).catch(e=>say("No se agregó: "+e.message,true));
    };
    sec.appendChild(add);
    board.appendChild(sec);
  });
  if(focusId){const el=board.querySelector(`[data-key="${focusId}"]`);if(el)el.focus();}
}

function row(m,ti){
  const el=document.createElement("div");el.className="member";el.dataset.id=m.id;
  el.innerHTML=`<input class="name" type="text" placeholder="Nombre" aria-label="Nombre, ${RANKS[ti]}">
    <input class="pts" type="number" step="1" placeholder="0" aria-label="Puntaje, ${RANKS[ti]}">
    <button class="del" type="button" title="Quitar tripulante" aria-label="Quitar tripulante">&times;</button>`;
  const name=el.querySelector(".name"),pts=el.querySelector(".pts");
  name.dataset.key=m.id+"n";pts.dataset.key=m.id+"p";
  name.value=m.n||"";pts.value=m.p??0;
  pts.classList.toggle("neg",Number(m.p)<0);
  name.oninput=e=>write(m.id,"n",e.target.value);
  pts.oninput=e=>{
    const v=e.target.value===""?0:Number(e.target.value);
    e.target.classList.toggle("neg",v<0);write(m.id,"p",v);
  };
  el.querySelector(".del").onclick=()=>{
    if(!confirm("¿Quitar a "+(m.n||"este tripulante")+" de "+RANKS[ti]+"?"))return;
    ref.child(m.id).remove().catch(e=>say("No se eliminó: "+e.message,true));
  };
  return el;
}

function refreshValues(g){
  const active=document.activeElement;
  g.flat().forEach(m=>{
    const el=board.querySelector(`[data-id="${m.id}"]`);if(!el)return;
    const name=el.querySelector(".name"),pts=el.querySelector(".pts");
    if(name!==active&&name.value!==(m.n||""))name.value=m.n||"";
    if(pts!==active&&Number(pts.value)!==Number(m.p??0)){pts.value=m.p??0;}
    pts.classList.toggle("neg",Number(m.p)<0);
  });
}

sortBtn.onclick=()=>{
  if(!confirm("¿Reordenar a todos por puntaje dentro de su rango?"))return;
  const updates={};
  groups().forEach(members=>{
    [...members].sort((a,b)=>Number(b.p)-Number(a.p))
      .forEach((m,i)=>{updates[m.id+"/o"]=i;});
  });
  ref.update(updates).catch(e=>say("No se ordenó: "+e.message,true));
};
</script>
</body>
</html>
