<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Sin Vergüenza - Tabla de posiciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--carbon:#11100E;--marfil:#FFF1CF;--rojo:#A91F27;--oro:#D9A832;--carbon2:#1A1814;--oro-dim:#8A6A1F;--marfil-dim:#B8AD93;box-sizing:border-box;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--carbon);color:var(--marfil);font-family:'Barlow Condensed',sans-serif;padding:18px}
.wrap{max-width:850px;margin:auto}.hero{text-align:center;border-bottom:2px solid var(--oro);padding:20px 8px 24px;margin-bottom:20px}
.kicker{font-size:13px;letter-spacing:.3em;color:var(--oro);text-transform:uppercase}h1{font-family:'Pirata One',serif;font-size:clamp(42px,9vw,76px);font-weight:400;line-height:1;margin:10px 0;color:var(--marfil)}h1 span{display:block;font:700 16px 'Barlow Condensed',sans-serif;letter-spacing:.35em;color:var(--oro);margin-top:12px}
.tier{border:1px solid var(--oro-dim);background:var(--carbon2);margin:14px 0 18px;border-radius:7px;overflow:hidden}.tier-head{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#252018;border-bottom:1px solid var(--oro-dim)}h2{font-family:'Pirata One',serif;font-weight:400;font-size:27px;margin:0;color:var(--oro)}.bars{display:flex;gap:4px;flex:1}.bars i{height:3px;background:var(--oro-dim);flex:1}.count{font-size:13px;color:var(--marfil-dim)}
.member{display:grid;grid-template-columns:minmax(0,1fr) 95px 38px;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid #373127}.member:last-of-type{border-bottom:0}input{min-width:0;width:100%;background:#11100e;color:var(--marfil);border:1px solid #4b4030;border-radius:4px;padding:10px;font:600 17px 'Barlow Condensed',sans-serif}input:focus{outline:1px solid var(--oro);border-color:var(--oro)}input.pts{text-align:center;font-size:20px;font-weight:700}input.neg{color:#ff7777;border-color:#a91f27}.frozen-label{color:var(--oro);font-weight:700;font-size:13px;text-align:center}.del{background:transparent;border:1px solid #6c2929;color:#ff8d8d;border-radius:4px;font-size:21px;cursor:pointer;height:39px}.del:disabled{opacity:.25;cursor:not-allowed}.add{margin:10px 12px 13px;background:transparent;border:1px dashed var(--oro-dim);color:var(--oro);padding:9px 12px;border-radius:4px;font:600 15px 'Barlow Condensed',sans-serif;cursor:pointer}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.bar button{flex:1;min-width:170px;background:var(--oro);color:#17130b;border:0;padding:12px 15px;border-radius:4px;font:700 16px 'Barlow Condensed',sans-serif;cursor:pointer}.bar button.danger{background:transparent;border:1px solid var(--rojo);color:#ff9c9c}.msg{min-height:20px;color:var(--marfil-dim);font-size:14px;text-align:center}.foot{text-align:center;color:#8c806a;font-size:12px;margin:26px 0 10px}
@media(max-width:420px){body{padding:10px}.tier-head{gap:7px;padding:10px}h2{font-size:23px}.count{font-size:11px}.member{grid-template-columns:minmax(0,1fr) 70px 32px;padding:8px}.member input{padding:9px 7px}.del{height:37px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div class="kicker">La tripulación</div><h1>El Sin Vergüenza<span>TABLA DE POSICIONES</span></h1></header>
<div id="board"></div>
<div class="bar"><button id="sortBtn" type="button">Ordenar por puntaje</button><button id="resetBtn" class="danger" type="button">Restaurar lista original</button></div>
<p class="msg" id="msg" aria-live="polite"></p><div class="foot">EL SIN VERGÜENZA · LA TRIPULACIÓN</div>
</div>
<script>
const SEED=[
 {rank:"Capitán",m:[{n:"",p:58}]},
 {rank:"Maestre",m:[{n:"",p:47}]},
 {rank:"Contramaestre",m:[{n:"",p:27}]},
 {rank:"Timonel",m:[{n:"",p:23}]},
 {rank:"Oficial de cubierta",m:[{n:"",p:14}]},
 {rank:"Maestro de máquinas",m:[{n:"",p:6}]},
 {rank:"Vigía",m:[{n:"Popó",p:2},{n:"Ian",p:6},{n:"Guadalupe",p:3},{n:"Omar",p:2},{n:"Jr",p:0},{n:"Cuau",p:2},{n:"Fernanda",p:3},{n:"Charles",p:-1},{n:"Gaby",p:0}]},
 {rank:"Cocinero",m:[{n:"Rodri",p:1},{n:"Gabriel",p:1}]},
 {rank:"Almirante / Cocinero",m:[{n:"Diego",p:0}]},
 {rank:"Mario",m:[{n:"",p:0,frozen:true}]}
];
const KEY="sinverguenza-tripulacion-v3";
const board=document.getElementById("board"),msg=document.getElementById("msg");
let data;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(d)&&d.length===SEED.length)return d;}catch(e){}return structuredClone(SEED)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));msg.textContent="Guardado en este navegador";}catch(e){msg.textContent="No se pudo guardar en este navegador";}}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function render(){
 board.innerHTML="";
 data.forEach((t,ti)=>{
  const sec=document.createElement("section");sec.className="tier";
  const bars=Array.from({length:Math.max(1,10-ti)},()=>"<i></i>").join("");
  sec.innerHTML=`<div class="tier-head"><h2>${esc(t.rank)}</h2><div class="bars">${bars}</div><span class="count">${t.m.length} ${t.m.length===1?"tripulante":"tripulantes"}</span></div>`;
  t.m.forEach((p,pi)=>{
   const row=document.createElement("div");row.className="member";
   const name=document.createElement("input");name.className="name";name.type="text";name.placeholder="Nombre";name.value=p.n||"";name.setAttribute("aria-label","Nombre, "+t.rank);name.disabled=!!p.frozen;
   const pts=document.createElement("input");pts.className="pts"+(Number(p.p)<0?" neg":"");pts.type="number";pts.step="1";pts.value=p.p;pts.setAttribute("aria-label","Puntaje, "+t.rank);pts.disabled=!!p.frozen;
   const del=document.createElement("button");del.className="del";del.type="button";del.textContent="×";del.title=p.frozen?"Puntaje congelado":"Quitar tripulante";del.disabled=!!p.frozen;
   if(p.frozen){const frozen=document.createElement("div");frozen.className="frozen-label";frozen.textContent="CONGELADO";row.append(name,pts,frozen)}
   else {row.append(name,pts,del)}
   name.oninput=e=>{t.m[pi].n=e.target.value;save()};
   pts.oninput=e=>{t.m[pi].p=e.target.value===""?0:Number(e.target.value);e.target.classList.toggle("neg",Number(e.target.value)<0);save()};
   del.onclick=()=>{if(!confirm("¿Quitar a este tripulante de "+t.rank+"?"))return;t.m.splice(pi,1);save();render()};
   sec.appendChild(row);
  });
  if(!t.m.some(p=>p.frozen)){
   const add=document.createElement("button");add.className="add";add.type="button";add.textContent="+ Agregar tripulante a "+t.rank;
   add.onclick=()=>{t.m.push({n:"",p:0});save();render();const names=sec.querySelectorAll(".member input.name");names[names.length-1]?.focus()};
   sec.appendChild(add);
  }
  board.appendChild(sec);
 });
}
document.getElementById("sortBtn").onclick=()=>{data.forEach(t=>t.m.sort((a,b)=>a.frozen?1:b.frozen?-1:Number(b.p)-Number(a.p)));save();render();msg.textContent="Ordenado por puntaje dentro de cada rango";};
document.getElementById("resetBtn").onclick=()=>{if(!confirm("¿Restaurar la lista original y perder los cambios guardados en este navegador?"))return;data=structuredClone(SEED);save();render();msg.textContent="Lista original restaurada";};
data=load();render();
</script>
</body>
</html>
